<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>李志娜 - 生日快乐</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎂</text></svg>">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Great+Vibes&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            overflow: hidden; 
            background: radial-gradient(ellipse at bottom, #1B2838 0%, #050505 100%);
            color: white; 
            perspective: 1000px;
            font-family: 'Ma Shan Zheng', cursive;
        }
        
        #canvas-container { 
            width: 100vw; height: 100vh; 
            position: fixed; top: 0; left: 0;
            z-index: 1; 
        }
        
        /* 星空背景 */
        #stars-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        
        /* 流星画布 */
        #meteor-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 2;
            pointer-events: none;
        }
        
        /* 烟花画布 */
        #fireworks-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 15;
            pointer-events: none;
            opacity: 0;
            transition: opacity 1s;
        }

        #ui {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%;
            pointer-events: none; 
            display: flex; flex-direction: column;
            align-items: center; 
            z-index: 10;
        }
        
        /* 装饰光环 */
        .decorative-rings {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            pointer-events: none;
        }
        
        .ring {
            position: absolute;
            border: 1px solid rgba(255, 0, 255, 0.2);
            border-radius: 50%;
            animation: ringPulse 4s ease-in-out infinite;
        }
        
        .ring:nth-child(1) { width: 300px; height: 300px; top: -150px; left: -150px; animation-delay: 0s; }
        .ring:nth-child(2) { width: 500px; height: 500px; top: -250px; left: -250px; animation-delay: 0.5s; }
        .ring:nth-child(3) { width: 700px; height: 700px; top: -350px; left: -350px; animation-delay: 1s; }
        
        @keyframes ringPulse {
            0%, 100% { opacity: 0.15; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.05); }
        }
        
        /* 标题样式 */
        h1 {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 4rem; 
            margin-top: 5vh; 
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #ffcc00 25%, #ff00ff 50%, #00ffff 75%, #fff 100%);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 20px rgba(255,0,255,0.4));
            opacity: 0; 
            transition: opacity 2s;
            letter-spacing: 8px;
            z-index: 20;
            animation: gradientShift 5s ease infinite;
            position: relative;
        }
        
        h1::before {
            content: '🎂';
            position: absolute;
            left: -70px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            animation: bounce 1s ease infinite;
            -webkit-text-fill-color: initial;
        }
        
        h1::after {
            content: '🎂';
            position: absolute;
            right: -70px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            animation: bounce 1s ease infinite 0.5s;
            -webkit-text-fill-color: initial;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(-50%) scale(1); }
            50% { transform: translateY(-60%) scale(1.1); }
        }

        .en-text {
            display: block; 
            font-family: 'Great Vibes', cursive;
            font-size: 3rem; 
            margin-top: 8px; 
            background: linear-gradient(90deg, #00ffff, #ff00ff, #00ffff);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 10px rgba(0,255,255,0.4));
            animation: shimmer 3s linear infinite;
        }
        
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        
        /* 祝福语 */
        .blessing-text {
            font-size: 1.5rem;
            color: rgba(255,255,255,0.9);
            margin-top: 15px;
            opacity: 0;
            transition: opacity 2s;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            letter-spacing: 3px;
        }
        
        /* ========== 修复：按钮样式 - 完全重写 ========== */
        .btn {
            pointer-events: auto; 
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 20px 50px;
            min-width: 320px;
            height: auto;
            border: 2px solid rgba(255,255,255,0.3);
            background: linear-gradient(135deg, rgba(189,0,255,0.4), rgba(0,255,255,0.4));
            color: #fff; 
            font-size: 1.5rem;
            font-family: 'Ma Shan Zheng', cursive;
            cursor: pointer; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            border-radius: 60px;
            box-shadow: 
                0 0 30px rgba(255,0,255,0.3),
                0 0 60px rgba(0,255,255,0.15),
                inset 0 0 20px rgba(255,255,255,0.1);
            margin-top: 38vh; 
            backdrop-filter: blur(10px);
            letter-spacing: 4px;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            text-align: center;
            line-height: 1.4;
        }
        
        .btn-text {
            display: inline-block;
            position: relative;
            z-index: 2;
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255,255,255,0.1),
                transparent
            );
            transform: rotate(45deg);
            animation: btnShine 3s ease-in-out infinite;
        }
        
        @keyframes btnShine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }
        
        .btn:hover { 
            background: linear-gradient(135deg, rgba(189,0,255,0.6), rgba(0,255,255,0.6));
            box-shadow: 
                0 0 50px rgba(255,0,255,0.5),
                0 0 100px rgba(0,255,255,0.3),
                inset 0 0 30px rgba(255,255,255,0.2);
            transform: scale(1.05) translateY(-3px);
        }
        
        .btn:active {
            transform: scale(0.98);
        }

        /* 照片容器 */
        #photo-container {
            position: fixed;
            top: 0; 
            left: 0; 
            width: 100vw;
            height: 100vh;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: none;
            transform-style: preserve-3d;
        }

        .photo-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 340px; 
            height: 450px;
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            padding: 12px 12px 55px 12px;
            box-sizing: border-box;
            box-shadow: 
                0 0 50px rgba(0, 255, 255, 0.4),
                0 0 100px rgba(255, 0, 255, 0.2),
                0 20px 50px rgba(0,0,0,0.4);
            backface-visibility: hidden;
            overflow: hidden;
            border-radius: 12px;
        }
        
        .photo-card::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(135deg, #ff00ff, #00ffff, #ffcc00, #ff00ff);
            background-size: 300% 300%;
            border-radius: 14px;
            z-index: -1;
            animation: borderRotate 4s linear infinite;
        }
        
        @keyframes borderRotate {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .photo-card img {
            width: 100%; 
            height: calc(100% - 5px); 
            object-fit: cover;
            border-radius: 8px;
            filter: saturate(1.05) contrast(1.02);
        }
        
        .photo-caption {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 1.25rem;
            color: #444;
        }

        .hologram-overlay {
            position: absolute; top: 0; left: 0; 
            width: 100%; height: 100%;
            background: 
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    rgba(0,0,0,0.02) 2px,
                    rgba(0,0,0,0.02) 4px
                );
            pointer-events: none; 
            opacity: 0.4; 
            z-index: 2;
            border-radius: 8px;
        }

        .shine-effect {
            position: absolute; 
            top: -100%; left: -100%; 
            width: 300%; height: 300%;
            background: linear-gradient(
                45deg,
                transparent 35%,
                rgba(255,255,255,0.4) 50%,
                transparent 65%
            );
            animation: shine 3s ease-in-out infinite;
            pointer-events: none;
            z-index: 3;
        }
        
        @keyframes shine { 
            0% { transform: translateX(-50%) translateY(-50%) rotate(45deg); } 
            100% { transform: translateX(50%) translateY(50%) rotate(45deg); } 
        }
        
        /* 照片计数器 */
        .photo-counter {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            display: none;
            gap: 12px;
            z-index: 25;
        }
        
        .counter-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.25);
            transition: all 0.3s;
            border: 2px solid rgba(255,255,255,0.4);
        }
        
        .counter-dot.active {
            background: linear-gradient(135deg, #ff00ff, #00ffff);
            box-shadow: 0 0 15px rgba(255,0,255,0.6);
            transform: scale(1.3);
        }

        #loader { 
            font-size: 1rem; 
            color: #aaa; 
            margin-top: 20px; 
            font-family: sans-serif;
            display: none;
        }
        
        /* 飘落的元素 */
        .floating-element {
            position: fixed;
            pointer-events: none;
            z-index: 5;
            opacity: 0.8;
            font-size: 1.5rem;
            animation: floatDown linear infinite;
        }
        
        @keyframes floatDown {
            0% {
                transform: translateY(-50px) rotate(0deg) scale(1);
                opacity: 0.9;
            }
            100% {
                transform: translateY(100vh) rotate(360deg) scale(0.6);
                opacity: 0;
            }
        }
        
        /* 音乐控制按钮 */
        #music-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.25);
            cursor: pointer;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            pointer-events: auto;
        }
        
        #music-toggle:hover {
            background: rgba(255,0,255,0.25);
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,0,255,0.5);
        }
        
        #music-toggle.playing {
            animation: pulse 1.5s ease infinite;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,0,255,0.4); }
            50% { box-shadow: 0 0 0 15px rgba(255,0,255,0); }
        }
        
        /* 粒子光标效果 */
        .cursor-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            animation: cursorFade 0.8s forwards;
        }
        
        @keyframes cursorFade {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0); opacity: 0; }
        }
        
        /* 蜡烛光晕 */
        .candle-glow {
            position: fixed;
            top: 45%;
            left: 50%;
            transform: translateX(-50%);
            width: 180px;
            height: 180px;
            background: radial-gradient(ellipse, rgba(255,180,80,0.3) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 4;
            opacity: 0;
            animation: candleFlicker 0.4s ease-in-out infinite alternate;
            pointer-events: none;
        }
        
        @keyframes candleFlicker {
            0% { transform: translateX(-50%) scale(1); opacity: 0.5; }
            100% { transform: translateX(-50%) scale(1.1); opacity: 0.7; }
        }
        
        /* 闪烁光点 */
        .sparkle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            animation: sparkleAnim 2.5s ease-in-out infinite;
        }
        
        @keyframes sparkleAnim {
            0%, 100% { opacity: 0; transform: scale(0); }
            50% { opacity: 0.8; transform: scale(1); }
        }
    </style>
    
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

    <!-- 星空背景 -->
    <canvas id="stars-canvas"></canvas>
    
    <!-- 流星画布 -->
    <canvas id="meteor-canvas"></canvas>
    
    <!-- 烟花画布 -->
    <canvas id="fireworks-canvas"></canvas>
    
    <!-- 3D粒子容器 -->
    <div id="canvas-container"></div>
    
    <!-- 装饰光环 -->
    <div class="decorative-rings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
    </div>
    
    <!-- 蜡烛光晕 -->
    <div class="candle-glow" id="candle-glow"></div>

    <div id="ui">
        <h1 id="title">
            李志娜
            <span class="en-text">Happy Birthday</span>
        </h1>
        <p class="blessing-text" id="blessing">愿所有美好都如约而至 ✨</p>
        
        <!-- 修复：按钮使用span包裹文字 -->
        <button id="start-btn" class="btn">
            <span class="btn-text">✨ 开启生日惊喜 ✨</span>
        </button>
        
        <div id="loader">正在准备惊喜...</div>

        <div id="photo-container">
            <div class="photo-card" id="current-photo-card">
                <div class="hologram-overlay"></div>
                <div class="shine-effect"></div>
                <img id="photo-img" src="" alt="美好回忆">
                <div class="photo-caption" id="photo-caption"></div>
            </div>
        </div>
        
        <div class="photo-counter" id="photo-counter"></div>
    </div>
    
    <!-- 音乐控制 -->
    <button id="music-toggle" title="音乐开关">🎵</button>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/examples/jsm/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';
        import { gsap } from 'https://cdn.jsdelivr.net/npm/gsap@3.9.1/index.js';

        // ===== 元素引用 =====
        const loader = document.getElementById('loader');
        const startBtn = document.getElementById('start-btn');
        const titleText = document.getElementById('title');
        const blessing = document.getElementById('blessing');
        const photoContainer = document.getElementById('photo-container');
        const photoImg = document.getElementById('photo-img');
        const photoCard = document.getElementById('current-photo-card');
        const photoCaption = document.getElementById('photo-caption');
        const photoCounter = document.getElementById('photo-counter');
        const musicToggle = document.getElementById('music-toggle');
        const candleGlow = document.getElementById('candle-glow');
        const fireworksCanvas = document.getElementById('fireworks-canvas');

        // ===== 照片配置 =====
        const photos = [
            { src: 'p1.jpg', caption: '' },
            { src: 'p2.jpg', caption: '' },
            { src: 'p3.jpg', caption: '' },
            { src: 'p4.jpg', caption: '' }
        ];

        // 创建照片计数器点
        photos.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'counter-dot';
            photoCounter.appendChild(dot);
        });
        const counterDots = document.querySelectorAll('.counter-dot');

        // ===== 创建闪烁光点 =====
        function createSparkles() {
            for (let i = 0; i < 15; i++) {
                const sparkle = document.createElement('div');
                sparkle.className = 'sparkle';
                sparkle.style.left = Math.random() * 100 + 'vw';
                sparkle.style.top = Math.random() * 100 + 'vh';
                sparkle.style.animationDelay = Math.random() * 2.5 + 's';
                sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
                document.body.appendChild(sparkle);
            }
        }
        createSparkles();

        // ===== 星空背景 =====
        const starsCanvas = document.getElementById('stars-canvas');
        const starsCtx = starsCanvas.getContext('2d');
        let stars = [];

        function initStars() {
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            stars = [];
            const starCount = Math.floor((window.innerWidth * window.innerHeight) / 5000);
            for (let i = 0; i < starCount; i++) {
                stars.push({
                    x: Math.random() * starsCanvas.width,
                    y: Math.random() * starsCanvas.height,
                    radius: Math.random() * 1.5 + 0.3,
                    opacity: Math.random() * 0.8 + 0.2,
                    twinkleSpeed: Math.random() * 0.02 + 0.005
                });
            }
        }

        function animateStars() {
            starsCtx.clearRect(0, 0, starsCanvas.width, starsCanvas.height);
            stars.forEach(star => {
                star.opacity += star.twinkleSpeed;
                if (star.opacity > 1 || star.opacity < 0.2) star.twinkleSpeed *= -1;
                
                starsCtx.beginPath();
                starsCtx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                starsCtx.fillStyle = `rgba(255, 255, 255, ${star.opacity * 0.7})`;
                starsCtx.fill();
            });
            requestAnimationFrame(animateStars);
        }

        initStars();
        animateStars();

        // ===== 流星效果 =====
        const meteorCanvas = document.getElementById('meteor-canvas');
        const meteorCtx = meteorCanvas.getContext('2d');
        let meteors = [];

        function initMeteorCanvas() {
            meteorCanvas.width = window.innerWidth;
            meteorCanvas.height = window.innerHeight;
        }

        function createMeteor() {
            if (Math.random() < 0.012) {
                meteors.push({
                    x: Math.random() * meteorCanvas.width * 0.8,
                    y: -20,
                    length: Math.random() * 80 + 50,
                    speed: Math.random() * 10 + 15,
                    opacity: 1
                });
            }
        }

        function animateMeteors() {
            meteorCtx.clearRect(0, 0, meteorCanvas.width, meteorCanvas.height);
            createMeteor();
            
            meteors.forEach((meteor, index) => {
                meteor.x += meteor.speed * 0.6;
                meteor.y += meteor.speed;
                meteor.opacity -= 0.01;

                if (meteor.opacity <= 0 || meteor.y > meteorCanvas.height) {
                    meteors.splice(index, 1);
                    return;
                }

                const gradient = meteorCtx.createLinearGradient(
                    meteor.x, meteor.y,
                    meteor.x - meteor.length * 0.6, meteor.y - meteor.length
                );
                gradient.addColorStop(0, `rgba(255, 255, 255, ${meteor.opacity})`);
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                meteorCtx.beginPath();
                meteorCtx.moveTo(meteor.x, meteor.y);
                meteorCtx.lineTo(meteor.x - meteor.length * 0.6, meteor.y - meteor.length);
                meteorCtx.strokeStyle = gradient;
                meteorCtx.lineWidth = 2;
                meteorCtx.lineCap = 'round';
                meteorCtx.stroke();
            });
            
            requestAnimationFrame(animateMeteors);
        }

        initMeteorCanvas();
        animateMeteors();

        // ===== 烟花效果 =====
        fireworksCanvas.width = window.innerWidth;
        fireworksCanvas.height = window.innerHeight;
        const fwCtx = fireworksCanvas.getContext('2d');
        let fireworks = [];
        let fwParticles = [];
        let fireworksActive = false;

        class Firework {
            constructor() {
                this.x = Math.random() * fireworksCanvas.width * 0.6 + fireworksCanvas.width * 0.2;
                this.y = fireworksCanvas.height;
                this.targetY = Math.random() * fireworksCanvas.height * 0.4 + 80;
                this.speed = Math.random() * 4 + 4;
                this.trail = [];
                this.exploded = false;
                this.hue = Math.random() * 360;
            }

            update() {
                if (!this.exploded) {
                    this.trail.push({ x: this.x, y: this.y });
                    if (this.trail.length > 12) this.trail.shift();
                    this.y -= this.speed;
                    if (this.y <= this.targetY) this.explode();
                }
            }

            explode() {
                this.exploded = true;
                const particleCount = Math.floor(Math.random() * 30) + 60;
                for (let i = 0; i < particleCount; i++) {
                    const angle = (Math.PI * 2 / particleCount) * i;
                    const speed = Math.random() * 5 + 2;
                    fwParticles.push({
                        x: this.x, y: this.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        hue: this.hue + Math.random() * 20 - 10,
                        life: 1,
                        decay: Math.random() * 0.015 + 0.01,
                        size: Math.random() * 2.5 + 1.5
                    });
                }
            }

            draw() {
                this.trail.forEach((point, index) => {
                    const opacity = (index / this.trail.length) * 0.7;
                    fwCtx.beginPath();
                    fwCtx.arc(point.x, point.y, 2, 0, Math.PI * 2);
                    fwCtx.fillStyle = `hsla(${this.hue}, 100%, 65%, ${opacity})`;
                    fwCtx.fill();
                });
            }
        }

        function animateFireworks() {
            if (!fireworksActive) return;
            fwCtx.fillStyle = 'rgba(0, 0, 0, 0.12)';
            fwCtx.fillRect(0, 0, fireworksCanvas.width, fireworksCanvas.height);

            if (Math.random() < 0.035) fireworks.push(new Firework());

            fireworks = fireworks.filter(fw => {
                fw.update();
                if (!fw.exploded) fw.draw();
                return !fw.exploded;
            });

            fwParticles = fwParticles.filter(p => {
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.1; p.vx *= 0.99;
                p.life -= p.decay;
                if (p.life > 0) {
                    fwCtx.beginPath();
                    fwCtx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                    fwCtx.fillStyle = `hsla(${p.hue}, 100%, 55%, ${p.life * 0.8})`;
                    fwCtx.fill();
                    return true;
                }
                return false;
            });

            requestAnimationFrame(animateFireworks);
        }

        function startFireworks() {
            fireworksActive = true;
            fireworksCanvas.style.opacity = 1;
            animateFireworks();
            setTimeout(() => {
                fireworksActive = false;
                gsap.to(fireworksCanvas, { opacity: 0, duration: 2 });
            }, 20000);
        }

        // ===== 飘落元素 =====
        function createFloatingElements() {
            const elements = ['💕', '✨', '🌸', '💫', '🎀', '🌟', '💝', '🎉'];
            setInterval(() => {
                const el = document.createElement('div');
                el.className = 'floating-element';
                el.textContent = elements[Math.floor(Math.random() * elements.length)];
                el.style.left = Math.random() * 100 + 'vw';
                el.style.animationDuration = (Math.random() * 5 + 6) + 's';
                el.style.fontSize = (Math.random() * 1 + 0.8) + 'rem';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 11000);
            }, 500);
        }

        // ===== 鼠标粒子效果 =====
        let lastMouseX = 0, lastMouseY = 0, particleHue = 0;
        document.addEventListener('mousemove', (e) => {
            const dx = e.clientX - lastMouseX;
            const dy = e.clientY - lastMouseY;
            if (Math.sqrt(dx * dx + dy * dy) > 20) {
                particleHue = (particleHue + 8) % 360;
                const particle = document.createElement('div');
                particle.className = 'cursor-particle';
                particle.style.left = e.clientX + 'px';
                particle.style.top = e.clientY + 'px';
                particle.style.background = `radial-gradient(circle, hsla(${particleHue}, 100%, 65%, 0.9), transparent)`;
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 800);
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            }
        });

        // ===== 音乐控制 =====
        let isPlaying = false;
        const bgMusic = new Audio('https://assets.mixkit.co/music/preview/mixkit-dreaming-big-31.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.35;

        musicToggle.addEventListener('click', () => {
            if (isPlaying) {
                bgMusic.pause();
                musicToggle.textContent = '🔇';
                musicToggle.classList.remove('playing');
            } else {
                bgMusic.play().catch(e => console.log('需要用户交互'));
                musicToggle.textContent = '🎵';
                musicToggle.classList.add('playing');
            }
            isPlaying = !isPlaying;
        });

        // ===== 照片展示 =====
        function playPhotos(index) {
            if (index >= photos.length) {
                photoContainer.style.display = 'none';
                photoCounter.style.display = 'none';
                startSequence();
                return;
            }

            photoContainer.style.display = 'flex';
            photoCounter.style.display = 'flex';
            photoImg.src = photos[index].src;
            photoCaption.textContent = photos[index].caption;
            
            counterDots.forEach((dot, i) => dot.classList.toggle('active', i === index));
            gsap.killTweensOf(photoCard);
            
            gsap.set(photoCard, {
                top: '50%', left: '50%',
                xPercent: -50, yPercent: -50,
                x: 0, y: 0
            });

            const tl = gsap.timeline();
            tl.fromTo(photoCard, 
                { scale: 0.3, opacity: 0, rotationY: 180, rotationX: 30, z: -500, filter: 'blur(15px)' },
                { scale: 1, opacity: 1, rotationY: 0, rotationX: 0, z: 0, filter: 'blur(0px)', duration: 1.5, ease: "back.out(1.4)" }
            );
            tl.to(photoCard, { y: -15, rotationY: 5, rotationX: 3, duration: 2, ease: "sine.inOut", yoyo: true, repeat: -1 });

            setTimeout(() => {
                gsap.killTweensOf(photoCard);
                gsap.to(photoCard, {
                    scale: 0.5, opacity: 0, rotationY: -90, z: 300, filter: "blur(10px)", 
                    duration: 0.7, ease: "power2.in",
                    onComplete: () => {
                        gsap.set(photoCard, { filter: "blur(0px)", y: 0, rotationX: 0, rotationY: 0, scale: 1, z: 0 });
                        playPhotos(index + 1);
                    }
                });
            }, 4000);
        }

        // ===== 开始按钮 =====
        startBtn.addEventListener('click', () => {
            gsap.to(startBtn, { 
                scale: 0, opacity: 0, rotation: 360, filter: 'blur(8px)',
                duration: 0.8, ease: "back.in(2)",
                onComplete: () => startBtn.style.display = 'none' 
            });
            bgMusic.play().then(() => {
                isPlaying = true;
                musicToggle.classList.add('playing');
                musicToggle.textContent = '🎵';
            }).catch(() => {});
            createFloatingElements();
            playPhotos(0);
        });

        // ===== 3D场景 =====
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.001);
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        const renderScene = new RenderPass(scene, camera);
        
        // ========== 调整：粒子亮度稍微提高 ==========
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight), 
            1.2, 0.4, 0.85
        );
        bloomPass.strength = 1.5;   // 从1.3提高到1.5
        bloomPass.radius = 0.7;     // 从0.6提高到0.7
        bloomPass.threshold = 0.05; // 从0.1降低到0.05
        
        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // 粒子纹理
        function getTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grad.addColorStop(0, 'rgba(255,255,255,0.95)');
            grad.addColorStop(0.2, 'rgba(255,255,255,0.7)');
            grad.addColorStop(0.5, 'rgba(255,200,255,0.35)');
            grad.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 64, 64);
            return new THREE.CanvasTexture(canvas);
        }

        // 文字粒子生成
        function getTextParticles(text, fontSize = 200) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillStyle = 'white';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, 256, 256);
            
            const data = ctx.getImageData(0, 0, 512, 512).data;
            const positions = [];
            const step = 4;
            
            for (let y = 0; y < 512; y += step) {
                for (let x = 0; x < 512; x += step) {
                    if (data[(y * 512 + x) * 4] > 128) {
                        positions.push((x - 256) * 0.07, (256 - y) * 0.07, (Math.random() - 0.5) * 2);
                    }
                }
            }
            return positions;
        }

        // 心形粒子
        function getHeartParticles() {
            const positions = [];
            const colors = [];
            const cPink = new THREE.Color(0xff69b4);
            const cRed = new THREE.Color(0xff0066);
            
            for (let i = 0; i < 3500; i++) {
                const t = (i / 3500) * Math.PI * 2;
                const scale = 1.6;
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                const z = (Math.random() - 0.5) * 6;
                positions.push(x, y, z);
                const mixedColor = cPink.clone().lerp(cRed, Math.random());
                colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
            }
            
            for (let i = 0; i < 1500; i++) {
                const t = Math.random() * Math.PI * 2;
                const r = Math.random() * 0.8;
                const scale = 1.4 * r;
                const x = 16 * Math.pow(Math.sin(t), 3) * scale;
                const y = (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * scale;
                positions.push(x, y, (Math.random() - 0.5) * 4);
                colors.push(cPink.r, cPink.g, cPink.b);
            }
            
            return { positions, colors };
        }

        // ========== 修改：蛋糕粒子 - 整体下移 ==========
        function getCakeParticles() {
            const positions = [];
            const colors = [];
            
            const cPurple = new THREE.Color(0xbd00ff);
            const cPink = new THREE.Color(0xff66cc);
            const cWhite = new THREE.Color(0xffffff);
            const cGold = new THREE.Color(0xffd700);
            const cFire = new THREE.Color(0xff6600);
            const cFireLight = new THREE.Color(0xffcc00);
            const cCream = new THREE.Color(0xfffacd);
            const cCherry = new THREE.Color(0xff0033);
            
            // ========== 关键：蛋糕整体下移量 ==========
            const offsetY = -5;  // 下移5个单位
            
            function add(x, y, z, c) {
                positions.push(x, y + offsetY, z);  // y坐标加上偏移
                colors.push(c.r, c.g, c.b);
            }

            // 底层蛋糕
            for (let i = 0; i < 4000; i++) {
                const r = Math.random() * 12;
                const t = Math.random() * Math.PI * 2;
                const y = (Math.random() - 0.5) * 6 - 5;
                const fR = Math.random() > 0.3 ? 12 : r;
                add(fR * Math.cos(t), y, fR * Math.sin(t), cPurple);
            }
            
            // 装饰边
            for (let i = 0; i < 300; i++) {
                const t = (i / 300) * Math.PI * 2;
                add(12.5 * Math.cos(t), -8, 12.5 * Math.sin(t), cGold);
            }

            // 中层蛋糕
            for (let i = 0; i < 3000; i++) {
                const r = Math.random() * 9;
                const t = Math.random() * Math.PI * 2;
                const y = Math.random() * 5 - 2;
                const fR = Math.random() > 0.3 ? 9 : r;
                add(fR * Math.cos(t), y, fR * Math.sin(t), cPink);
            }

            // 奶油边
            for (let i = 0; i < 400; i++) {
                const t = (i / 400) * Math.PI * 2;
                const wave = Math.abs(Math.sin(t * 15)) * 1.5;
                add(9.5 * Math.cos(t), 3 - wave, 9.5 * Math.sin(t), cCream);
            }

            // 顶层蛋糕
            for (let i = 0; i < 2500; i++) {
                const r = Math.random() * 5.5;
                const t = Math.random() * Math.PI * 2;
                const y = Math.random() * 3.5 + 3;
                const fR = Math.random() > 0.3 ? 5.5 : r;
                add(fR * Math.cos(t), y, fR * Math.sin(t), cWhite);
            }

            // 蜡烛
            for (let i = 0; i < 5; i++) {
                const angle = (i / 5) * Math.PI * 2;
                const cx = Math.cos(angle) * 3;
                const cz = Math.sin(angle) * 3;
                
                for (let j = 0; j < 120; j++) {
                    const y = 6.5 + j * 0.035;
                    const r = 0.3;
                    const t = Math.random() * Math.PI * 2;
                    add(cx + r * Math.cos(t), y, cz + r * Math.sin(t), i % 2 === 0 ? cGold : cPink);
                }
                
                for (let j = 0; j < 80; j++) {
                    const y = 10.5 + Math.random() * 2;
                    const r = Math.random() * 0.5 * (1 - (y - 10.5) / 2);
                    const t = Math.random() * Math.PI * 2;
                    const color = cFireLight.clone().lerp(cFire, (y - 10.5) / 2);
                    add(cx + r * Math.cos(t), y, cz + r * Math.sin(t), color);
                }
            }

            // 樱桃
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2 + Math.PI / 6;
                const cx = Math.cos(angle) * 4.5;
                const cz = Math.sin(angle) * 4.5;
                
                for (let j = 0; j < 50; j++) {
                    const r = Math.random() * 0.8;
                    const t = Math.random() * Math.PI * 2;
                    const p = Math.random() * Math.PI;
                    add(cx + r * Math.sin(p) * Math.cos(t), 7 + r * Math.cos(p), cz + r * Math.sin(p) * Math.sin(t), cCherry);
                }
            }

            return { positions, colors };
        }

        const shape3 = getTextParticles("3");
        const shape2 = getTextParticles("2");
        const shape1 = getTextParticles("1");
        const shapeHeart = getHeartParticles();
        const shapeCake = getCakeParticles();
        
        const maxParticles = Math.max(shapeCake.positions.length / 3, shape3.length / 3, shapeHeart.positions.length / 3, 12000);

        const geometry = new THREE.BufferGeometry();
        const pPos = new Float32Array(maxParticles * 3);
        const pCol = new Float32Array(maxParticles * 3);

        for (let i = 0; i < maxParticles; i++) {
            const angle = Math.random() * Math.PI * 2;
            const radius = Math.random() * 150 + 40;
            pPos[i * 3] = Math.cos(angle) * radius;
            pPos[i * 3 + 1] = (Math.random() - 0.5) * 80;
            pPos[i * 3 + 2] = Math.sin(angle) * radius;
            pCol[i * 3] = 0.5;
            pCol[i * 3 + 1] = 0.8;
            pCol[i * 3 + 2] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

        // ========== 调整：粒子材质亮度 ==========
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.5,       // 从0.45提高到0.5
            map: getTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.85    // 从0.75提高到0.85
        });

        const particlesMesh = new THREE.Points(geometry, particleMaterial);
        scene.add(particlesMesh);

        // 变形函数
        function morphTo(targetPositions, targetColors, duration, onComplete) {
            const currentPositions = particlesMesh.geometry.attributes.position.array;
            const currentColors = particlesMesh.geometry.attributes.color.array;

            for (let i = 0; i < maxParticles; i++) {
                let tx, ty, tz, cr, cg, cb;
                
                if (targetPositions && targetPositions.length > 0) {
                    const idx = i % (targetPositions.length / 3);
                    tx = targetPositions[idx * 3];
                    ty = targetPositions[idx * 3 + 1];
                    tz = targetPositions[idx * 3 + 2];
                } else {
                    const angle = Math.random() * Math.PI * 2;
                    const radius = Math.random() * 120 + 30;
                    tx = Math.cos(angle) * radius;
                    ty = (Math.random() - 0.5) * 60;
                    tz = Math.sin(angle) * radius;
                }
                
                if (targetColors && targetColors.length > i * 3 + 2) {
                    cr = targetColors[i * 3];
                    cg = targetColors[i * 3 + 1];
                    cb = targetColors[i * 3 + 2];
                } else {
                    cr = 0; cg = 0.8; cb = 1;
                }

                gsap.to(currentPositions, {
                    [i * 3]: tx, [i * 3 + 1]: ty, [i * 3 + 2]: tz,
                    duration: duration, ease: "power2.inOut", delay: Math.random() * 0.25
                });

                gsap.to(currentColors, {
                    [i * 3]: cr, [i * 3 + 1]: cg, [i * 3 + 2]: cb,
                    duration: duration * 0.7
                });
            }
            
            if (onComplete) setTimeout(onComplete, duration * 1000 + 400);
        }

        let isCake = false, sequenceStarted = false;

        function startSequence() {
            if (sequenceStarted) return;
            sequenceStarted = true;
            
            morphTo(shape3, null, 1);
            setTimeout(() => morphTo(shape2, null, 1), 1800);
            setTimeout(() => morphTo(shape1, null, 1), 3600);
            setTimeout(() => morphTo(shapeHeart.positions, shapeHeart.colors, 1.8), 5400);
            setTimeout(() => {
                isCake = true;
                morphTo(shapeCake.positions, shapeCake.colors, 2.2, () => {
                    gsap.to(titleText, { opacity: 1, duration: 2 });
                    gsap.to(blessing, { opacity: 1, duration: 2, delay: 0.5 });
                    candleGlow.style.opacity = '1';
                    startFireworks();
                });
            }, 8000);
        }

        // 鼠标交互
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', e => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.0005;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.0005;
        });

        // 动画循环
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            particlesMesh.geometry.attributes.position.needsUpdate = true;
            particlesMesh.geometry.attributes.color.needsUpdate = true;

            if (isCake) {
                particlesMesh.rotation.y += 0.002;
                particlesMesh.rotation.x += (mouseY * 0.3 - particlesMesh.rotation.x) * 0.03;
                particlesMesh.rotation.y += (mouseX * 0.3) * 0.03;
                particlesMesh.scale.setScalar(1 + Math.sin(time * 1.2) * 0.015);
                particleMaterial.size = 0.5 + Math.sin(time * 1.5) * 0.06;
            } else {
                particlesMesh.rotation.y = Math.sin(time * 0.4) * 0.3;
                particlesMesh.rotation.x = Math.cos(time * 0.25) * 0.1;
            }

            composer.render();
        }

        animate();

        // 窗口调整
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            starsCanvas.width = window.innerWidth;
            starsCanvas.height = window.innerHeight;
            meteorCanvas.width = window.innerWidth;
            meteorCanvas.height = window.innerHeight;
            fireworksCanvas.width = window.innerWidth;
            fireworksCanvas.height = window.innerHeight;
            initStars();
        });

        // 预加载图片
        photos.forEach(photo => {
            const img = new Image();
            img.src = photo.src;
        });

        console.log(' 页面加载完成！');
    </script>
</body>
